<section class="mx-auto max-w-screen-2xl px-4 md:px-8">
  <header class="mb-4 flex items-center justify-between py-4 md:py-8">
    <a href="/" class="inline-flex items-center gap-2.5 text-2xl font-bold text-amber-700 md:text-3xl">
      <div class="h-10 w-10 overflow-hidden rounded-full bg-gray-100 md:h-14 md:w-14">
        <img class="h-10 w-10 md:h-18 md:w-18 object-cover" src="assets/amanah.jpeg" alt="">
      </div>
      AMANAH
    </a>

    <nav class="hidden gap-12 lg:flex">
      <a [routerLink]="['/']" 
        routerLinkActive="active-link" 
        [routerLinkActiveOptions]="{exact: true}"
        class="text-lg font-semibold text-gray-600 transition duration-100 hover:text-amber-500">
        Home
      </a>

      <a [routerLink]="['/jobs-page']" 
        routerLinkActive="active-link" 
        class="text-lg font-semibold text-gray-600 transition duration-100 hover:text-amber-500">
        Jobs
      </a>

      <a [routerLink]="['/donation']" 
        routerLinkActive="active-link" 
        class="text-lg font-semibold text-gray-600 transition duration-100 hover:text-amber-500">
        Spende
      </a>

      <a [routerLink]="['/about-us']" 
        routerLinkActive="active-link" 
        class="text-lg font-semibold text-gray-600 transition duration-100 hover:text-amber-500">
        Über uns
      </a>
    </nav>

    <div class="hidden lg:block">
      <a (click)="scrollToContact()" class="inline-block cursor-pointer rounded-lg bg-amber-500 px-8 py-3 text-center text-sm font-semibold text-white outline-none ring-amber-300 transition duration-100 hover:bg-amber-600 focus-visible:ring active:bg-amber-700 md:text-base">Kontakt</a>
    </div>

    <button type="button" (click)="toggleMenu()" class="inline-flex items-center gap-2 rounded-lg bg-gray-200 px-2.5 py-2 text-sm font-semibold text-gray-500 lg:hidden cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h6a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
      </svg>
      Menu
    </button>
  </header>

  <div *ngIf="isMenuOpen" class="fixed inset-0 z-50 flex flex-col bg-amber-500/95 p-8 lg:hidden">
    <div class="flex justify-end">
        <button (click)="toggleMenu()" 
                class="text-white transition duration-100 hover:text-yellow-900 cursor-pointer outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <nav class="mt-12 flex flex-col items-center gap-8">
      <a [routerLink]="['/']" (click)="isMenuOpen = false" class="text-2xl font-bold text-white transition duration-100 hover:text-yellow-900 cursor-pointer">Home</a>
      <a [routerLink]="['/jobs-page']" (click)="isMenuOpen = false" class="text-2xl font-bold text-white transition duration-100 hover:text-yellow-900 cursor-pointer">Jobs</a>
      <a [routerLink]="['/donation']" (click)="isMenuOpen = false" class="text-2xl font-bold text-white transition duration-100 hover:text-yellow-900 cursor-pointer">Spende</a>
      <a [routerLink]="['/about-us']" (click)="isMenuOpen = false" class="text-2xl font-bold text-white transition duration-100 hover:text-yellow-900 cursor-pointer">Über uns</a>
      
      <a (click)="scrollToContact(); isMenuOpen = false" class="mt-4 rounded-full bg-white px-10 py-4 text-xl font-bold text-amber-600 shadow-lg transition duration-100 hover:bg-amber-50 hover:scale-105 cursor-pointer">
        Kontakt
      </a>
    </nav>
  </div>
</section>
